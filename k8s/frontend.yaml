apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: journey-browser
spec:
  type: ClusterIP
  selector: { app: journey-frontend }
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: journey-frontend
  namespace: journey-browser
spec:
  replicas: 2
  selector: { matchLabels: { app: journey-frontend } }
  template:
    metadata: { labels: { app: journey-frontend } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: frontend
          image: FRONTEND_IMAGE
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }