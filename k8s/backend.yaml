apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: journey-browser
spec:
  type: ClusterIP
  selector: { app: journey-backend }
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: journey-backend
  namespace: journey-browser
spec:
  replicas: 2
  selector: { matchLabels: { app: journey-backend } }
  template:
    metadata: { labels: { app: journey-backend } }
    spec:
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: backend
          image: BACKEND_IMAGE
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - name: ENVIRONMENT
              value: production
            - name: FRONTEND_URL
              value: https://FRONTEND_HOST
          envFrom:
            - secretRef: { name: journey-browser-secrets, optional: true }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
          volumeMounts: [{ name: storage, mountPath: /app/storage }]
      volumes: [{ name: storage, persistentVolumeClaim: { claimName: journey-backend-storage } }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: journey-backend-storage
  namespace: journey-browser
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
  # Change this only if your cluster uses a different default StorageClass.